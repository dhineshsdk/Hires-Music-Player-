name: BitChord baseline

on:
  push:
    branches: [codex/bitchord-base]
    paths:
      - 'bitchord/**'
      - '.github/workflows/bitchord-baseline.yml'
  pull_request:
    paths:
      - 'bitchord/**'
      - '.github/workflows/bitchord-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitchord-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitchord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Build phone and run existing tests
        run: bash ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest :shared:jvmTest -Pbitchord.bundleWear=false --console=plain
      - name: Record lint findings
        if: ${{ !cancelled() }}
        run: bash ./gradlew :app:lintDevDebug -Pbitchord.bundleWear=false --console=plain
      - name: Upload baseline APK and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-baseline
          path: |
            bitchord/app/build/outputs/apk/dev/debug/*.apk
            bitchord/app/build/reports/
            bitchord/shared/build/reports/
          if-no-files-found: warn
