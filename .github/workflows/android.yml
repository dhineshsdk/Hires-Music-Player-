name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Host tests (sample-format rules)
        working-directory: src/app/src/test/cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I../../main/cpp/core pcm_encoding_test.cpp -o pcm_encoding_test
          ./pcm_encoding_test
          g++ -std=c++20 -Wall -Wextra -Werror -fno-exceptions -fsanitize=address,undefined -I../../main/cpp/decoders wav_decoder_test.cpp ../../main/cpp/decoders/WavDecoder.cpp -o wav_decoder_test
          ./wav_decoder_test
          sudo apt-get update -qq && sudo apt-get install -y -qq libflac-dev ffmpeg
          g++ -std=c++20 -Wall -Wextra -Werror -fno-exceptions -fsanitize=address,undefined -I../../main/cpp/decoders flac_decoder_test.cpp ../../main/cpp/decoders/FlacDecoder.cpp -lFLAC -o flac_decoder_test
          # Reference PCM comes from ffmpeg's own FLAC decoder, so the check is independent of libFLAC.
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=4:c=pink:r=44100:a=0.7:seed=7" -af aformat=channel_layouts=stereo -sample_fmt s16 -c:a flac t16.flac
          ffmpeg -v error -y -i t16.flac -f s16le -c:a pcm_s16le t16.raw
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=4:c=pink:r=96000:a=0.7:seed=7" -af aformat=channel_layouts=stereo -sample_fmt s32 -c:a flac -bits_per_raw_sample 24 t24.flac
          ffmpeg -v error -y -i t24.flac -f s24le -c:a pcm_s24le t24.raw
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=3:c=white:r=192000:a=0.9:seed=3" -af aformat=channel_layouts=stereo -sample_fmt s32 -c:a flac -bits_per_raw_sample 24 h.flac
          ffmpeg -v error -y -i h.flac -f s24le -c:a pcm_s24le h.raw
          ./flac_decoder_test t16.flac t16.raw 2 16
          ./flac_decoder_test t24.flac t24.raw 3 24
          ./flac_decoder_test h.flac h.raw 3 24
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-exceptions -fsanitize=address,undefined -I../../main/cpp/decoders dsd_decoder_test.cpp ../../main/cpp/decoders/DsdDecoder.cpp -o dsd_decoder_test
          ./dsd_decoder_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-exceptions -fsanitize=address,undefined -I../../main/cpp/decoders -I../../main/cpp/core null_test.cpp ../../main/cpp/decoders/WavDecoder.cpp -o null_test
          ./null_test

      - name: Build debug APK
        run: ./gradlew --no-daemon --continue assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keep one rolling pre-release with the newest APK, so it can be installed from a phone link.
      - name: Publish APK to the latest-debug pre-release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk hires-player-debug.apk
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --title "Latest debug build" \
              --notes "Debug APK from the newest CI build." --target "$GITHUB_SHA"
          gh release upload latest-debug hires-player-debug.apk --clobber
          gh release edit latest-debug --notes "Debug APK built from ${GITHUB_SHA::7} (${{ github.head_ref || github.ref_name }})."
